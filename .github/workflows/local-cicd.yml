name: Local Docker CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-docker-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Check Docker
        shell: powershell
        run: docker version

      - name: Build Docker image
        shell: powershell
        run: docker build -t my-cicd-web:latest .

      - name: Replace Docker container
        shell: powershell
        run: |
          $existingContainer = docker ps -a --filter "name=^/my-web$" --format "{{.Names}}"

          if ($existingContainer -eq "my-web") {
            docker rm -f my-web
          }

          docker run -d --name my-web -p 8080:80 my-cicd-web:latest

      - name: Test website
        shell: powershell
        run: |
          Start-Sleep -Seconds 3
          $response = Invoke-WebRequest -Uri "http://localhost:8080" -UseBasicParsing

          if ($response.StatusCode -ne 200) {
            throw "Website test failed: HTTP $($response.StatusCode)"
          }

          Write-Host "Deployment successful: HTTP $($response.StatusCode)"
